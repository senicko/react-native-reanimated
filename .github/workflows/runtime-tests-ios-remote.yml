# EXPERIMENTAL — iOS runtime tests with the test job on Ubuntu, driving a
# remote simulator on argent cloud.
#
# Same artifact hand-off as runtime-tests-ios-split.yml, but run-tests runs on
# ubuntu-latest with no simulator of its own: scripts/runtime-tests-remote.sh
# uploads the app to the cloud sim over QUIC (sim-remote simctl install),
# selects the library via launchd env (sim-remote setenv), reverse-tunnels the
# app's ws://localhost:8082 reporting dial back to the runner (sim-remote
# proxy), and collects results with runtime-tests-server.js in server mode.
#
# sim-remote (CLI + daemon) installs from the public sim-remote-releases
# GitHub release — no secret needed for the download. Auth is ambient: the
# daemon reads two environment variables, wired from repository secrets:
#   SIM_ROUTER_USERNAME
#   SIM_ROUTER_API_KEY
# They are set at the job level (not per step) on purpose — the daemon is
# spawned by whichever sim-remote call runs first and then outlives that
# step, so every step must offer the same credentials.
name: Runtime tests iOS (remote simulator)
env:
  YARN_ENABLE_HARDENED_MODE: 0
on:
  # TEMP (fork testing only): run on every push of this branch.
  push:
    branches:
      - ci/split-fork-test
  workflow_dispatch:
    inputs:
      configuration:
        description: Build configuration (must be self-contained, i.e. Release*)
        required: false
        type: string
        default: ReleaseRuntimeTests
      udid:
        description: Remote simulator UUID (blank = first available iPhone)
        required: false
        type: string
        default: ""

permissions:
  contents: read

concurrency:
  group: runtime-tests-ios-remote-${{ github.ref }}
  cancel-in-progress: true

jobs:
  # Fail in seconds — not after a 40-minute macOS build — when the cloud
  # credentials aren't configured. (The secrets context is not available in
  # job-level `if:`, hence the env indirection.)
  preflight:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    env:
      HAS_USERNAME: ${{ secrets.SIM_ROUTER_USERNAME != '' }}
      HAS_API_KEY: ${{ secrets.SIM_ROUTER_API_KEY != '' }}
    steps:
      - name: Check cloud credentials are configured
        run: |
          if [ "$HAS_USERNAME" != "true" ] || [ "$HAS_API_KEY" != "true" ]; then
            echo "::error::SIM_ROUTER_USERNAME and/or SIM_ROUTER_API_KEY secrets are not set — configure them in the repo settings before running this workflow"
            exit 1
          fi

  build-app:
    needs: preflight
    # TEMP (fork testing only): upstream repo guard removed so the job runs on forks.
    runs-on: macos-26
    timeout-minutes: 90
    env:
      WORKING_DIRECTORY: apps/fabric-example
      CONFIGURATION: ${{ inputs.configuration || 'ReleaseRuntimeTests' }}
    steps:
      - name: checkout
        uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5
        with:
          persist-credentials: false

      - name: Use Ruby version from `.ruby-version` file
        uses: ruby/setup-ruby@6aaa311d81eba98ae12eaffbcb63296ace0efcde
        with:
          bundler-cache: true

      - name: Install monorepo node dependencies
        run: yarn install --immutable

      - name: Build Reanimated package
        working-directory: packages/react-native-reanimated
        run: yarn build

      - name: Install Pods
        uses: ./.github/actions/install-pods
        with:
          working-directory: ${{ env.WORKING_DIRECTORY }}
          pod-directory: ios

      - name: Cache DerivedData
        uses: ./.github/actions/cache-derived-data
        with:
          platform: ios
          working-directory: ${{ env.WORKING_DIRECTORY }}
          pod-directory: ios

      - name: Build runtime-tests app
        working-directory: ${{ env.WORKING_DIRECTORY }}
        run: node scripts/runtime-tests-server.js --build-only --configuration "$CONFIGURATION"

      - name: Package app artifact
        working-directory: ${{ env.WORKING_DIRECTORY }}
        run: node scripts/export-runtime-tests-app.js --configuration "$CONFIGURATION" --out dist/FabricExample.app.zip

      - name: Upload app artifact
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: runtime-tests-app-remote-${{ env.CONFIGURATION }}
          path: apps/fabric-example/dist/FabricExample.app.zip
          if-no-files-found: error
          retention-days: 3

  run-tests-remote:
    needs: build-app
    runs-on: ubuntu-latest # <- the whole point: no macOS, no local simulator
    timeout-minutes: 45
    env:
      WORKING_DIRECTORY: apps/fabric-example
      CONFIGURATION: ${{ inputs.configuration || 'ReleaseRuntimeTests' }}
      # Job-level on purpose: the sim-remote daemon is spawned by the first
      # CLI call and persists across steps — it must always see credentials.
      SIM_ROUTER_USERNAME: ${{ secrets.SIM_ROUTER_USERNAME }}
      SIM_ROUTER_API_KEY: ${{ secrets.SIM_ROUTER_API_KEY }}
    steps:
      - name: checkout
        uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5
        with:
          persist-credentials: false

      - name: Install monorepo node dependencies
        run: yarn install --immutable

      - name: Install sim-remote CLI + daemon
        run: |
          # Public release. CLI and daemon must be siblings — the CLI spawns
          # the daemon (which owns the QUIC session and the reverse tunnels)
          # from its own directory.
          TARGET=x86_64-unknown-linux-gnu # ubuntu-latest runners are x86_64
          REL="https://github.com/software-mansion/sim-remote-releases/releases/download/softu"
          mkdir -p "$HOME/.local/bin"
          curl -fsSL -o "$HOME/.local/bin/sim-remote" "$REL/sim-remote-$TARGET"
          curl -fsSL -o "$HOME/.local/bin/sim-remote-daemon" "$REL/sim-remote-daemon-$TARGET"
          chmod +x "$HOME/.local/bin/sim-remote" "$HOME/.local/bin/sim-remote-daemon"
          echo "$HOME/.local/bin" >> "$GITHUB_PATH"
          # smoke check: the CLI has no --version flag; --help exits 0
          "$HOME/.local/bin/sim-remote" --help > /dev/null

      - name: Log in and acquire a cloud machine
        run: |
          # `sim-remote login` authenticates against sim-router AND acquires a
          # Mac from the pool (waits up to 120 s for a free one by default).
          # Credentials come from SIM_ROUTER_USERNAME / SIM_ROUTER_API_KEY in
          # the job env — clap env fallbacks, so no flags needed.
          sim-remote login
          # The acquired machine's simulators are now visible:
          sim-remote simctl list devices --json | jq -e '.devices' > /dev/null
          echo "logged in, machine acquired"

      - name: Download app artifact
        uses: actions/download-artifact@448e3f862ab3ef47aa50ff917776823c9946035b
        with:
          name: runtime-tests-app-remote-${{ env.CONFIGURATION }}
          path: apps/fabric-example/dist

      - name: Unpack app artifact
        working-directory: ${{ env.WORKING_DIRECTORY }}
        run: |
          # unzip (not ditto — this is Linux); the zip was created with
          # ditto --keepParent so it unpacks to unpacked/FabricExample.app

          unzip -q dist/FabricExample.app.zip -d dist/unpacked

      - name: Pick remote simulator and install app
        id: sim
        working-directory: ${{ env.WORKING_DIRECTORY }}
        env:
          INPUT_UDID: ${{ inputs.udid }}
        run: |
          UDID="$INPUT_UDID"
          if [ -z "$UDID" ]; then
            UDID=$(sim-remote simctl list devices --json \
              | jq -r '[.devices[][] | select(.isAvailable != false)
                        | select(.name | startswith("iPhone"))]
                       | sort_by(.state != "Booted") | .[0].udid // empty')
          fi
          if [ -z "$UDID" ]; then
            echo "::error::no available remote iPhone simulator found"
            exit 1
          fi
          echo "using remote simulator $UDID"
          echo "udid=$UDID" >> "$GITHUB_OUTPUT"
          scripts/runtime-tests-remote.sh install --udid "$UDID" \
            --app-path dist/unpacked/FabricExample.app

      - name: Run ReJest self-tests on the remote simulator
        working-directory: ${{ env.WORKING_DIRECTORY }}
        run: >
          scripts/runtime-tests-remote.sh run --udid "${{ steps.sim.outputs.udid }}"
          --library self-tests --configuration "$CONFIGURATION"

      - name: Verify CI catches failing tests
        working-directory: ${{ env.WORKING_DIRECTORY }}
        run: |
          if scripts/runtime-tests-remote.sh run --udid "${{ steps.sim.outputs.udid }}" \
            --library self-tests --configuration "$CONFIGURATION" \
            --only "intentional failures";
          then
            echo "A failing suite did not fail the runner" && exit 1
          else
            echo "Failing tests correctly failed the runner"
          fi

      - name: Run Worklets runtime tests on the remote simulator
        working-directory: ${{ env.WORKING_DIRECTORY }}
        run: >
          scripts/runtime-tests-remote.sh run --udid "${{ steps.sim.outputs.udid }}"
          --library worklets --configuration "$CONFIGURATION"

      - name: Run Reanimated runtime tests on the remote simulator
        working-directory: ${{ env.WORKING_DIRECTORY }}
        run: >
          scripts/runtime-tests-remote.sh run --udid "${{ steps.sim.outputs.udid }}"
          --library reanimated --configuration "$CONFIGURATION"

      - name: Release remote simulator
        if: always()
        working-directory: ${{ env.WORKING_DIRECTORY }}
        run: |
          UDID="${{ steps.sim.outputs.udid }}"
          if command -v sim-remote >/dev/null; then
            if [ -n "$UDID" ]; then
              sim-remote proxy stop "$UDID" 8082 || true
              sim-remote simctl shutdown "$UDID" || true
            fi
            # End the session and hand the machine back to the pool.
            sim-remote logout || true
          fi
